         localStorage 键与旧主题一致，老访客的暗色偏好不丢。
         主题 CSS 分两档：`dark` / `light` 加在 <html>（Tailwind 的 dark: 变体），
         `dark-mode` / `light-mode` 加在 <body>（code-theme.styl 的代码块配色按 body 选档）。
         两者必须同时同步、并各自移除反向类，否则切换后暗色代码块会掉回亮色配色。 --><script>
      (function () {
        const KEY = 'REDEFINE-THEME-STATUS';
        let theme = null;
        try {
          const saved = localStorage.getItem(KEY);
          if (saved) theme = JSON.parse(saved).isDark ? 'dark' : 'light';
        } catch (e) {
          /* 坏数据按未保存处理 */
        }
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        const root = document.documentElement;
        const apply = function (t) {
          const other = t === 'dark' ? 'light' : 'dark';
          /* <html> 只带裸档位（Tailwind dark: 变体），反向档位一并摘掉避免残留。 */
          root.classList.remove(other);
          root.classList.add(t);
          /* 代码块配色认 <body> 上的 <theme>-mode，切换时两档互斥。 */
          if (document.body) {
            document.body.classList.remove(t + '-mode', other + '-mode');
            document.body.classList.add(t + '-mode');
          }
          root.style.colorScheme = t;
        };
        apply(theme);
        // 本脚本在 <head> 里执行时 document.body 还不存在，DOM 就绪后补一次。
        document.addEventListener('DOMContentLoaded', function () {
          apply(theme);
        });
      })();
